<div class="container">
  <h2 class="title">Add New Product</h2>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-3">
      <label>Brand</label>
      <input type="text" formControlName="brand" class="form-control" />
      <div
        *ngIf="form.get('brand')?.invalid && form.get('brand')?.touched"
        class="text-danger"
      >
        Brand is required
      </div>
    </div>

    <div class="mb-3">
      <label>Description</label>
      <textarea formControlName="description" class="textarea"></textarea>
      <div
        *ngIf="
          form.get('description')?.invalid && form.get('description')?.touched
        "
        class="text-danger"
      >
        Description is required
      </div>
    </div>

    <div class="mb-3">
      <label>Price</label>
      <input type="number" formControlName="price" class="input" />
      <div
        *ngIf="form.get('price')?.invalid && form.get('price')?.touched"
        class="text-danger"
      >
        Price is required and must be a positive number
      </div>
    </div>

    <button type="submit" [disabled]="submiting" class="btn-blue">
      Simpan
    </button>
  </form>
</div>
